schema: spec-driven

context: |
  Product: EventsSound, a web for a sound/lights/DJ events company (about us, event portfolio, service catalog, bookings, client/admin users). Master's thesis (TFM, Master en Desarrollo con IA). Data is SYNTHETIC, no real client data.
  Core: AI quote agent (LangGraph) with tools buscar_equipamiento, consultar_disponibilidad, calcular_precio (deterministic price function = eval oracle), RAG over catalog, generated proposal, public chat for non-logged users.
  Security/LLMOps: OWASP GenAI (prompt injection, rate limit, cost cap); LangSmith evals; provider-agnostic LlmProvider (Ollama/OpenRouter/APIs) with replay mode for tests.
  Planned stack: FastAPI, SQLAlchemy 2.0, Alembic, Pydantic v2, Pytest, Postgres, JWT+RBAC; Vite+React+TS+shadcn/ui; Docker Compose; GitHub Actions + Sentry.
  Architecture: hexagonal/clean, DI, SOLID. Greenfield: only README.md exists (state at init: 2026-10-09).
  Conventions: conventional commits, no AI attribution in commits; artifacts/code/docs in English, user-facing UI copy in Spanish. TFM deliverables: README, public repo, live URL, slides, video.

strict_tdd: true # flipped in PR 4 (feat/deploy-config) after pytest and vitest ran green in CI on main

testing:
  strict_tdd: true
  strict_tdd_note: >
    Enabled in PR 4: pytest (backend) and vitest (frontend) run in CI. Runner commands work from the repo root.
  detected: "2026-10-10"
  runner:
    command: "uv run --project backend pytest backend/tests" # DB tests skip unless DATABASE_URL_TEST is set
    framework: "Pytest (backend), Vitest (frontend: cd frontend && npm run test -- --run)"
  layers:
    unit: { available: true, tool: "pytest, vitest" }
    integration: { available: true, tool: "pytest + TestClient, Postgres via Docker Compose (needs DATABASE_URL_TEST)" }
    e2e: { available: false, tool: null } # planned: Playwright (TBD)
  coverage: { available: true, command: "uv run --project backend pytest backend/tests --cov=eventssound" }
  quality:
    linter: { available: true, command: "uv run --project backend ruff check backend; cd frontend && npm run lint" } # ruff (backend), eslint (frontend)
    type_checker: { available: true, command: "cd frontend && npx tsc --noEmit" } # tsc (frontend); backend type checker not configured
    formatter: { available: true, command: "uv run --project backend ruff format --check backend" } # ruff format
  llm_testing: "LlmProvider replay mode for deterministic tests; calcular_precio is the eval oracle; LangSmith evals for agent quality."

rules:
  proposal:
    - Include rollback plan for risky changes
    - State impact on the AI agent (tools, prompts, evals) and on security (OWASP GenAI) when relevant
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Respect hexagonal boundaries (domain / application / adapters); inject ports via DI
    - Document architecture decisions with rationale; include sequence diagrams for agent flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    rules:
      - Follow existing code patterns
      - Use synthetic data only; never commit secrets (.env, API keys)
    tdd: true
    test_command: "uv run --project backend pytest backend/tests"
  verify:
    test_command: "uv run --project backend pytest backend/tests"
    build_command: "cd frontend && npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
