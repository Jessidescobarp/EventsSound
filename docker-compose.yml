services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventssound}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventssound}
      POSTGRES_DB: ${POSTGRES_DB:-eventssound}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opt-in: docker compose --profile app up --build
  backend:
    profiles: ["app"]
    build: ./backend
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eventssound}:${POSTGRES_PASSWORD:-eventssound}@db:5432/${POSTGRES_DB:-eventssound}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
